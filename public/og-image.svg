<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <pattern id="geo" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <polygon points="20,2 22.4,8.8 29.6,8.8 23.8,13 26.2,20 20,15.8 13.8,20 16.2,13 10.4,8.8 17.6,8.8"
        fill="#B8934A" opacity="0.08"/>
    </pattern>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B3D2E"/>
      <stop offset="100%" stop-color="#082d21"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#geo)"/>

  <!-- Gold border -->
  <rect x="20" y="20" width="1160" height="590" rx="8" fill="none" stroke="#B8934A" stroke-width="1.2" opacity="0.5"/>
  <rect x="32" y="32" width="1136" height="566" rx="6" fill="none" stroke="#B8934A" stroke-width="0.5" stroke-dasharray="6 5" opacity="0.3"/>

  <!-- Arch outline (centered) -->
  <g transform="translate(540, 60)">
    <path d="M20 220 L20 100 Q20 10 60 10 Q100 10 100 100 L100 220 Z"
      stroke="#B8934A" stroke-width="1.5" fill="rgba(11,61,46,0.6)"/>
    <!-- Door panels -->
    <rect x="24" y="104" width="34" height="112" fill="#0a3528" stroke="#B8934A" stroke-width="0.8" opacity="0.9"/>
    <rect x="62" y="104" width="34" height="112" fill="#0a3528" stroke="#B8934A" stroke-width="0.8" opacity="0.9"/>
    <!-- Apex star -->
    <circle cx="60" cy="14" r="4" fill="#B8934A"/>
  </g>

  <!-- Bismillah -->
  <text x="600" y="88" text-anchor="middle" font-family="'Amiri', serif" font-size="28"
    fill="#F5EDD5" opacity="0.9">بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ</text>

  <!-- Names -->
  <text x="600" y="360" text-anchor="middle"
    font-family="'Cormorant Garamond', Georgia, serif" font-size="68" font-weight="500"
    fill="#F5EDD5">Zeba Kausar</text>
  <text x="600" y="406" text-anchor="middle"
    font-family="Georgia, serif" font-size="22" font-weight="400"
    fill="#B8934A">with</text>
  <text x="600" y="456" text-anchor="middle"
    font-family="'Cormorant Garamond', Georgia, serif" font-size="52" font-weight="500"
    fill="#F5EDD5">Mohammed Yasin M. Gouli</text>

  <!-- Gold line separator -->
  <line x1="460" y1="478" x2="740" y2="478" stroke="#B8934A" stroke-width="0.8" opacity="0.6"/>

  <!-- Date & venue -->
  <text x="600" y="510" text-anchor="middle"
    font-family="Georgia, serif" font-size="22"
    fill="#B8934A">Saturday, 19 December 2026 · 11:45 AM</text>
  <text x="600" y="542" text-anchor="middle"
    font-family="Georgia, serif" font-size="18"
    fill="rgba(245,237,213,0.65)">Arsh Garden · Gudihal Road · Hubli</text>
</svg>
